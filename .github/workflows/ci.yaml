name: CI Pipeline

on: 
    push: 
        branches: [ main ]
    
jobs:
    backend-cli:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: Backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                
            - name: Debug repo Structure
              run: |
                pwd
                ls
                ls -la

            - name: Install Backend Dependencies
              run: npm ci

            - name: Run backend test
              run: npm test || echo "No tests Configured"

    docker-build:
        runs-on: ubuntu-latest
        needs: backend-cli

        services: 
            redis: 
                image: redis:7
                ports:
                    - 6379:6379
            postgres:
                image: postgres:15
                env: 
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: GattaRoad
                    POSTGRES_DB: stock-trading
                ports:
                    - 5432:5432
        env:
            REDIS_URL: redis://redis:6379
            DATABASE_URL: postgres://postgres:GattaRoad@postgres:5432/stock-trading
            
        steps: 
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build backend Docker image
              run: docker build -t stock-trading-backend ./Backend 
