name: CI Pipeline

on: 
    push: 
        branches: [ main ]
    
jobs:
    backend-cli:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: Backend
        
        services:
            redis: 
                image: redis:7
                ports: 
                    - 6379:6379
            postgres:
                image: postgres:15
                env: 
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: GattaRoad
                    POSTGRES_DB: stock-trading
                ports: 
                    - 5432:5432
        env:
            REDIS_URL: redis://localhost:6379
            DATABASE_URL: postgres://postgres:GattaRoad@localhost:5432/stock-trading
            NODE_ENV: test
            GEMINI_API_KEY: dummy-key-for-cli
            JWT_SECRET: test-secret-key-for-ci

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                
            - name: Debug repo Structure
              run: |
                pwd
                ls
                ls -la

            - name: Install Backend Dependencies
              run: npm ci --legacy-peer-deps

            - name: Wait for Redis
              run: |
                for i in {1..10}; do
                    nc -z localhost 6379 && echo "Redis is up" && exit 0
                    echo "Waiting for Redis"
                    sleep 2
                done
                echo "Redis did not start in time"
                exit 1    

            - name: Wait for Postgres
              run: |
                for i in {1..10}; do
                    nc -z localhost 5432 && echo "Postgres is up" && exit 0
                    echo "Waiting for postgres"
                    sleep 2
                done
                exit 1
            
            - name: Initialize the database
              env: 
                PGPASSWORD: GattaRoad
              run: |
                sudo apt-get install -y postgresql-client
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/01_tables.sql
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/02_portfolio.sql
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/03_orders.sql
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/04_add_expires_at.sql
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/05_notifications_and_users.sql
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/06_enhanced_auth.sql
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/07_missing_variables.sql
                psql -h localhost -U postgres -d stock-trading -f ./docker-entrypoint-initdb.d/08_Adding_Wallet.sql
                
            - name: Run backend test
              run: npm test
            

    build-and-push:
        runs-on: ubuntu-latest
        needs: backend-cli
        if: success()
        steps: 
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with: 
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Backend Image
              uses: docker/build-push-action@v5
              with: 
                context: ./Backend
                file: ./Backend/Dockerfile
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/stock-trading-backend:latest
                    ${{ secrets.DOCKER_USERNAME }}/stock-trading-backend:${{ github.sha }}

            - name: Install Frontend Dependencies
              working-directory: frontend
              run: npm ci

            - name: Test Frontend
              working-directory: frontend
              run: |
                npm install
                npm run test

            - name: Build Frontend 
              working-directory: frontend
              run: npm run build

            - name: Build and push Frontend Image
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                file: ./frontend/Dockerfile
                push: true
                build-args: |
                  VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
                tags: |
                  ${{ secrets.DOCKER_USERNAME }}/stock-trading-frontend:latest
                  ${{ secrets.DOCKER_USERNAME }}/stock-trading-frontend:${{ github.sha }}
